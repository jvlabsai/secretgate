name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["20", "22"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: no-network check
        run: npm run check:no-network
      # The corpus is generated rather than committed; `pretest` and `prebench`
      # build it, so nothing extra is needed here.
      - run: npm test
      - name: corpus benchmark
        run: npm run bench
      - run: npm run build

  scores-are-current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: regenerate the corpus and confirm the committed scores still hold
        run: |
          npm run bench -- --update
          git diff --exit-code test/scores.json || {
            echo
            echo "Detection quality changed and test/scores.json was not updated."
            echo "Run: npm run bench -- --update   and commit the result,"
            echo "so the change is visible in review rather than silent."
            exit 1
          }
